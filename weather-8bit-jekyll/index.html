---
layout: default
title: Weather 8-Bit
---

<div id="weather-info">
    <p id="weather-description">Loading...</p>
    <p id="weather-temperature">Temperature: --°C</p>
</div>

<!-- Update your cat-clock-container div to include all four legs -->
<div id="cat-clock-container">
    <div class="cat-outline">
        <div class="cat-head">
            <div class="cat-ear left"></div>
            <div class="cat-ear right"></div>
            <div class="cat-face">
                <div class="cat-eye left"></div>
                <div class="cat-eye right"></div>
                <div class="cat-nose"></div>
                <div class="cat-mouth"></div>
            </div>
        </div>
        <div class="cat-body">
            <div class="cat-clock-display">
                <div id="cat-clock">00:00</div>
                <div id="cat-date">01-JAN</div>
                <div id="cat-day">MON</div>
            </div>
            <!-- Front left leg -->
            <div class="cat-leg left front"></div>
            <!-- Back left leg -->
            <div class="cat-leg left back"></div>
            <!-- Front right leg -->
            <div class="cat-leg right front"></div>
            <!-- Back right leg -->
            <div class="cat-leg right back"></div>
            <div class="cat-tail"></div>
        </div>
    </div>
</div>

<div class="card" style="--card-color: {{ character.color }}">
    <div class="card-icon">
      <div class="pixel-art">{{ character.icon }}</div>
    </div>
    <h2 class="card-name">{{ character.name }}</h2>
    <div class="card-type">{{ character.type }}</div>
    <p class="card-description">{{ character.description }}</p>
    <div class="pixel-effect"></div>
  </div>
